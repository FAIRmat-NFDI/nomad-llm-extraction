[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
name = "nomad-llm-extraction"
description = "Repo for LLM data extraction"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sharat Patil", email = "patilsha@physik.hu-berlin.de" },
]
maintainers = [
    { name = "Sharat Patil", email = "patilsha@physik.hu-berlin.de" },
]
license = { file = "LICENSE" }
dependencies = [
    "jsonref>=1.1.0",
    "jsonschema>=4.26.0",
    "pydantic",
    "temporalio",
    "PyPDF2",
    "instructor",
    "google-generativeai",
    "nomad-lab>=1.4.1",
    "loguru>=0.7.3",
    #"scalpl>=0.4.2",
]

[project.urls]
Repository = "https://github.com/FAIRmat-NFDI/nomad-llm-extraction"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "structlog",
    "mkdocs",
    "mkdocs-material==8.1.1",
    "pymdown-extensions",
    "mkdocs-click",
    "pytest-asyncio",
]

tutorial = [
    "deepdiff>=9.0.0",
    "jupyterlab>=4.5.6",
]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]

[tool.uv.sources]
nomad-lab = { git = "https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-FAIR.git" }

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "F401", # remove unused import
  "FAST", # FastAPI
  "I001", # sort imports
  "PL", # pylint
  "UP", # pyupgrade
  "W", # pycodestyle
]
ignore = [
  "F403", # 'from module import *' used; unable to detect undefined names
  "PLC0415", # `import` should be at the top-level of a file
  "E402", # Module level import not at top of file
  "E501", # Line too long ({width} > {limit} characters)
  "E701", # Multiple statements on one line (colon)
  "E731", # Do not assign a lambda expression, use a def
  "PLR0904", # too-many-public-methods
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "PLR0917", # too-many-positional-arguments
  "PLR1714", # consider-using-in
  "PLR2004", # Magic value used instead of constant
  "PLR5501", # else-if-used
  "PLW0603", # Using the global statement
  "PLW2901", # redefined-loop-name
  "PLC0415", # import-outside-top-level
]
fixable = ["ALL"]
isort.split-on-trailing-comma = false

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["PLC0415"] # import-outside-top-level

# this is entirely optional, you can remove this if you wish to
[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"

# indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
schema_package_entry_point = "nomad_llm_extraction.schema_packages:schema_package_entry_point"
app_entry_point = "nomad_llm_extraction.apps:app_entry_point"
example_upload_entry_point = "nomad_llm_extraction.example_uploads:example_upload_entry_point"
action_entry_point = "nomad_llm_extraction.actions.simple_action:simple_action_entry_point"

[tool.cruft]
# Avoid updating workflow files, this leads to permissions issues
skip = [".github/*"]


